# summary: 檢查 docs/ 與 README 索引是否與 workflow 定義同步（內部 CI，非 reusable）
# category: 內部 CI
name: Docs Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**.yml"
      - "docs/**.md"
      - "scripts/gen_workflow_docs.py"
      - "scripts/release-profile-contract-test.py"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/**.yml"
      - "docs/**.md"
      - "scripts/gen_workflow_docs.py"
      - "scripts/release-profile-contract-test.py"
      - "README.md"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: uv run scripts/gen_workflow_docs.py --check

      - run: uv run scripts/release-profile-contract-test.py
