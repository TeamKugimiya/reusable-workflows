# summary: 檢查 docs/ 與 README 索引是否與 workflow 定義同步（內部 CI，非 reusable）
# category: 內部 CI
name: Docs Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**.yml"
      - "docs/**.md"
      - "scripts/gen_workflow_docs.py"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/**.yml"
      - "docs/**.md"
      - "scripts/gen_workflow_docs.py"
      - "README.md"

permissions:
  contents: read

jobs:
  check:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - run: uv run scripts/gen_workflow_docs.py --check
