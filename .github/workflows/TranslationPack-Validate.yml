# summary: 透過 translation-toolkit doctor 驗證翻譯專案健康狀態
# category: 翻譯包
name: 翻譯包｜驗證

on:
  workflow_call:
    inputs:
      project_path:
        required: false
        type: string
        default: "."
        description: "翻譯專案根目錄路徑，對應 translation-tool doctor 的 ``--path``"
      format:
        required: false
        type: string
        default: "github"
        description: "doctor 輸出格式，可用 ``text``、``json``、``markdown`` 或 ``github``；``github`` 會輸出 Actions annotation"
      severity:
        required: false
        type: string
        default: "error"
        description: "annotation 的最低顯示嚴重度，可用 ``error``、``warning`` 或 ``info``。嚴重度只影響顯示、不影響結束碼。預設只標註 error，因為 GitHub 每個 step 每種等級最多顯示 10 則 annotation，專案既有的 warning 會把額度吃光、反而蓋掉本次 PR 相關的項目；完整的 warning 清單改由 job summary 提供"
      remote:
        required: false
        type: boolean
        default: false
        description: "是否啟用 ``--remote``，額外驗證遠端平台、最新版資訊與最新版 JAR 的 ``en_us.json``"
      strict:
        required: false
        type: boolean
        default: false
        description: "是否啟用 ``--strict``，將 warning 也視為驗證失敗"
      job_summary:
        required: false
        type: boolean
        default: true
        description: "是否將 warning 以上的完整診斷報告寫入 job summary。annotation 有每種等級 10 則的顯示上限，summary 沒有，適合放專案整體的健康清單；``remote: true`` 時會略過以免重跑一次遠端驗證"
      modrinth_user_agent:
        required: false
        type: string
        default: ""
        description: "遠端驗證 Modrinth 時使用的 ``MODRINTH_USER_AGENT``；留空則使用專案 ``config/settings.json`` 或工具預設"
      toolkit_version:
        required: false
        type: string
        default: ""
        description: "要使用的 translation-toolkit release tag；留空抓 latest。安裝時會驗證 SHA512SUMS，因此必須是 ``v1.8.0`` 以後的版本"
      runs_on:
        required: false
        type: string
        default: "blacksmith-2vcpu-ubuntu-2404-arm"
        description: "執行環境，預設為 ``blacksmith-2vcpu-ubuntu-2404-arm``"
    secrets:
      toolkit_token:
        required: true
        description: "用於下載私人 translation-toolkit release 的 PAT（需 ``repo`` 權限）"
      curseforge_api_key:
        required: false
        description: "遠端驗證 CurseForge 專案時使用的 API key；會設定為 ``CURSEFORGE_API_KEY``"

permissions:
  contents: read

jobs:
  validate:
    name: 驗證翻譯專案
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安裝 translation-tool
        uses: TeamKugimiya/reusable-workflows/.github/actions/setup-toolkit@v1
        with:
          token: ${{ secrets.toolkit_token }}
          translation: true
          version: ${{ inputs.toolkit_version }}

      - name: 驗證翻譯專案
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          DOCTOR_FORMAT: ${{ inputs.format }}
          DOCTOR_SEVERITY: ${{ inputs.severity }}
          DOCTOR_REMOTE: ${{ inputs.remote }}
          DOCTOR_STRICT: ${{ inputs.strict }}
          MODRINTH_USER_AGENT: ${{ inputs.modrinth_user_agent }}
          CURSEFORGE_API_KEY: ${{ secrets.curseforge_api_key }}
        shell: bash
        run: |
          set -euo pipefail

          args=(doctor --path "$PROJECT_PATH" --format "$DOCTOR_FORMAT" --severity "$DOCTOR_SEVERITY")

          if [ "$DOCTOR_REMOTE" = "true" ]; then
            args+=(--remote)
          fi

          if [ "$DOCTOR_STRICT" = "true" ]; then
            args+=(--strict)
          fi

          translation-tool "${args[@]}"

      # annotation 每個 step 每種等級最多顯示 10 則，專案累積的 warning 會把額度
      # 吃光，反而蓋掉本次 PR 真正相關的項目。完整清單改放 job summary：沒有筆數
      # 上限、不會污染 Files changed，也保留了整個專案的健康狀況。
      # 上一步失敗時報告更需要被看到，所以用 always()。
      - name: 輸出完整報告至 job summary
        if: ${{ always() && inputs.job_summary && !inputs.remote }}
        continue-on-error: true
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        shell: bash
        run: |
          set -uo pipefail

          # 有 error 時 doctor 以非零結束，但這一步只負責呈現，擋門交給上一步。
          # markdown 輸出自帶標題與總計，直接附加即可。
          report=$(translation-tool doctor --path "$PROJECT_PATH" --format markdown --severity warning) || true

          if [ -n "$report" ]; then
            printf '%s\n' "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
