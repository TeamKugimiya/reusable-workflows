# summary: 從 ParaTranz 下載譯文並建立自動更新 PR
# category: 模組包
name: 模組包｜ParaTranz 下載

on:
  workflow_call:
    inputs:
      base_branch:
        required: false
        type: string
        default: "main"
        description: "自動更新 PR 的目標分支"
      commit_message:
        required: false
        type: string
        default: "chore: 同步 ParaTranz 翻譯"
        description: "自動更新 commit message"
      pr_title:
        required: false
        type: string
        default: "chore: 同步 ParaTranz 翻譯"
        description: "自動建立 PR 的標題"
      pr_body:
        required: false
        type: string
        default: "Automated ParaTranz translation sync generated by modpack-toolkit."
        description: "自動建立 PR 的內容"
      toolkit_version:
        required: false
        type: string
        default: ""
        description: "要使用的 modpack-toolkit release tag；留空抓 latest"
      runs_on:
        required: false
        type: string
        default: "ubuntu-latest"
        description: "執行環境，預設為 ``ubuntu-latest``"
    secrets:
      toolkit_token:
        required: true
        description: "用於下載私人 modpack-toolkit release 的 PAT（需 ``repo`` 權限）"
      paratranz_token:
        required: true
        description: "下載 ParaTranz artifact 時使用；會設定為 ``PARATRANZ_TOKEN``"
      create_pull_request_token:
        required: false
        description: "建立同步 PR 用的 PAT；提供後自動 PR 才會觸發其他 CI（預設 ``GITHUB_TOKEN`` 建的 PR 不觸發）。留空則用預設 ``GITHUB_TOKEN``"
    outputs:
      changed:
        description: "是否產生翻譯更新"
        value: ${{ jobs.download.outputs.changed }}
      branch:
        description: "有更新時建立的分支名稱"
        value: ${{ jobs.download.outputs.branch }}
      pull_request_url:
        description: "有更新時建立的 PR URL"
        value: ${{ jobs.download.outputs.pull_request_url }}

permissions:
  contents: write
  pull-requests: write

jobs:
  download:
    name: 下載 ParaTranz 譯文
    runs-on: ${{ inputs.runs_on }}
    outputs:
      changed: ${{ steps.cpr.outputs.pull-request-operation != 'none' }}
      branch: ${{ steps.cpr.outputs.pull-request-branch || '' }}
      pull_request_url: ${{ steps.cpr.outputs.pull-request-url || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: 安裝 modpack-toolkit
        uses: TeamKugimiya/reusable-workflows/.github/actions/setup-toolkit@v1
        with:
          token: ${{ secrets.toolkit_token }}
          version: ${{ inputs.toolkit_version }}

      - name: 下載並轉換譯文
        env:
          PARATRANZ_TOKEN: ${{ secrets.paratranz_token }}
        run: modpack-toolkit sync download --convert

      - name: 建立 Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.create_pull_request_token || github.token }}
          base: ${{ inputs.base_branch }}
          branch: automation/paratranz-download
          delete-branch: true
          commit-message: ${{ inputs.commit_message }}
          title: ${{ inputs.pr_title }}
          body: ${{ inputs.pr_body }}
          add-paths: |
            .modpack-meta
            paratranz
            translation
