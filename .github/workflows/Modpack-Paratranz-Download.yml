# summary: 從 ParaTranz 下載譯文並建立自動更新 PR
# category: 模組包
name: 模組包｜ParaTranz 下載

on:
  workflow_call:
    inputs:
      base_branch:
        required: false
        type: string
        default: "main"
        description: "自動更新 PR 的目標分支"
      commit_message:
        required: false
        type: string
        default: "chore: 同步 ParaTranz 翻譯"
        description: "自動更新 commit message"
      toolkit_version:
        required: false
        type: string
        default: ""
        description: "要使用的 modpack-tool release tag；留空抓 latest"
      runs_on:
        required: false
        type: string
        default: "blacksmith-2vcpu-ubuntu-2404"
        description: "執行環境，預設為 ``blacksmith-2vcpu-ubuntu-2404``"
    secrets:
      toolkit_token:
        required: true
        description: "用於下載私人 modpack-tool release 的 PAT（需 ``repo`` 權限）"
      paratranz_token:
        required: true
        description: "下載 ParaTranz artifact 時使用；會設定為 ``PARATRANZ_TOKEN``"
      create_pull_request_token:
        required: false
        description: "建立同步 PR 用的 PAT；提供後自動 PR 才會觸發其他 CI（預設 ``GITHUB_TOKEN`` 建的 PR 不觸發）。留空則用預設 ``GITHUB_TOKEN``"
    outputs:
      changed:
        description: "是否產生翻譯更新"
        value: ${{ jobs.download.outputs.changed }}
      branch:
        description: "有更新時建立的分支名稱"
        value: ${{ jobs.download.outputs.branch }}
      pull_request_url:
        description: "有更新時建立的 PR URL"
        value: ${{ jobs.download.outputs.pull_request_url }}

permissions:
  contents: write
  pull-requests: write

jobs:
  download:
    name: 下載 ParaTranz 譯文
    runs-on: ${{ inputs.runs_on }}
    outputs:
      changed: ${{ steps.cpr.outputs.pull-request-operation != 'none' }}
      branch: ${{ steps.cpr.outputs.pull-request-branch || '' }}
      pull_request_url: ${{ steps.cpr.outputs.pull-request-url || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: 安裝 modpack-tool
        uses: TeamKugimiya/reusable-workflows/.github/actions/setup-toolkit@v1
        with:
          token: ${{ secrets.toolkit_token }}
          version: ${{ inputs.toolkit_version }}

      - name: 下載並轉換譯文
        env:
          PARATRANZ_TOKEN: ${{ secrets.paratranz_token }}
        run: modpack-tool sync download --convert

      - name: 產生 Pull Request 內容
        id: pr-body
        shell: bash
        run: |
          set -euo pipefail

          body_path="${RUNNER_TEMP}/paratranz-download-pr-body.md"
          printf '自動同步 ParaTranz 翻譯。\n' > "${body_path}"

          state_path=".modpack-meta/paratranz-files.json"
          {
            printf '\n## ParaTranz 狀態\n\n'

            if [ -f "${state_path}" ]; then
              jq -r '
                def blank($v): $v == null or $v == "";
                def value($v): if blank($v) then "—" else ($v | tostring) end;
                def code($v): if blank($v) then "—" else "`" + ($v | tostring) + "`" end;

                . as $state |
                ($state.translation_progress // null) as $progress |
                [
                  "| 項目 | 值 |",
                  "| --- | --- |",
                  "| 專案 slug | " + code($state.project_slug) + " |",
                  "| ParaTranz project ID | " + value($state.paratranz_project_id) + " |",
                  "| Wire format | " + code($state.wire_format) + " |",
                  "| 追蹤檔案數 | " + value((($state.files // {}) | length)) + " |"
                ]
                + (
                  if $progress == null then
                    ["| 翻譯進度 | — |"]
                  else
                    [
                      "| Artifact ID | " + value($progress.artifact_id) + " |",
                      "| Artifact 建立時間 | " + code($progress.created_at) + " |",
                      "| 完成度 | " + value($progress.translated) + " / " + value($progress.total) + " (" + value($progress.completion_percent) + "%) |",
                      "| 未翻譯條數 | " + value($progress.untranslated) + " |",
                      "| 有疑問條數 | " + value($progress.disputed) + " |",
                      "| 已審核 | " + value($progress.reviewed) + " |",
                      "| 隱藏 | " + value($progress.hidden) + " |",
                      "| 耗時 | " + value($progress.duration_ms) + " ms |"
                    ]
                  end
                )
                | .[]
              ' "${state_path}"
            else
              printf '_找不到 state file `%s`。_\n' "${state_path}"
            fi
          } >> "${body_path}"

          printf 'path=%s\n' "${body_path}" >> "${GITHUB_OUTPUT}"

      - name: 建立 Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          base: ${{ inputs.base_branch }}
          branch: automation/paratranz-download
          delete-branch: true
          commit-message: ${{ inputs.commit_message }}
          title: "chore: 同步 ParaTranz 翻譯"
          body-path: ${{ steps.pr-body.outputs.path }}
          add-paths: |
            .modpack-meta
            paratranz
            translation
