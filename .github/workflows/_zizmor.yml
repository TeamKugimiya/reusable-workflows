# summary: 以 zizmor 稽核 workflow 與 composite action 的 Actions 安全問題（內部 CI，非 reusable）
# category: 內部 CI
name: GitHub Actions Security

on:
  push:
    branches:
      - main
    paths:
      - .github/actions/**
      - .github/workflows/**
      - zizmor.yml
  pull_request:
    paths:
      - .github/actions/**
      - .github/workflows/**
      - zizmor.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: zizmor
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # advanced-security 需 GitHub Advanced Security 才能上傳 SARIF；改用 annotations
      # 直接在 PR diff 標註 finding，兩者互斥必須明寫 advanced-security: false。
      # zizmor 讀取 repo root 的 zizmor.yml（container workdir 即 workspace），不必另傳 config。
      # 使用此 Action commit 內建的預設版本與 container digest，隨 Action 一起更新。
      # 不另設 version，避免掃描器版本超出 Action 內建的支援清單。
      - name: Audit GitHub Actions
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
          min-severity: low
          persona: regular
