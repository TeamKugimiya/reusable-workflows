# summary: 以 govulncheck 檢查實際呼叫到的已知弱點，並以 Betterleaks 掃描完整 Git 歷史的 secret
# category: 工具鏈
name: Go Toolkit｜安全掃描

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: toolkit-security-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulnerabilities:
    name: Go vulnerabilities
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      # govulncheck only fails for vulnerable symbols the code can reach, so a
      # scheduled run reports newly published advisories without the noise of
      # module-level matches that the code never calls.
      - name: Run govulncheck
        run: ./scripts/check.sh vuln

  secrets:
    name: Secret scanning
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Betterleaks v1.8.1
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/security-tools"
          case "$(uname -m)" in
            x86_64)  slug=linux_x64;   sha=efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a ;;
            aarch64) slug=linux_arm64; sha=bbb578b12a2f65d7082ab436abf37724232bc71d8a078e3c41336574420f1b48 ;;
            *) echo "::error::Betterleaks 沒有 $(uname -m) 的預先計算校驗和"; exit 1 ;;
          esac
          archive="${RUNNER_TEMP}/betterleaks_1.8.1_${slug}.tar.gz"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/betterleaks/betterleaks/releases/download/v1.8.1/betterleaks_1.8.1_${slug}.tar.gz"
          printf '%s  %s\n' "$sha" "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$tool_dir" betterleaks
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"

      # A scanner that loads its rules but matches nothing would pass silently;
      # the canary proves the pinned binary still detects a known token shape.
      - name: Verify Betterleaks with a canary
        shell: bash
        run: |
          set -euo pipefail
          canary="${RUNNER_TEMP}/secret-scanner-canary.txt"
          {
            printf 'token = "ghp_'
            printf 'wA9mK2pLxN4vRtQzY6bC8dEfGhJlM0oPq1rS'
            printf '"\n'
          } > "$canary"

          set +e
          betterleaks dir "$canary" \
            --no-banner \
            --no-color \
            --redact=100 \
            --exit-code=7 \
            --report-format=json \
            --report-path="${RUNNER_TEMP}/betterleaks-canary.json" \
            >/dev/null 2>&1
          code=$?
          set -e

          if [ "$code" -ne 7 ]; then
            echo "::error::Betterleaks canary 失敗（exit=${code}）"
            exit 1
          fi

      - name: Run Betterleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-reports
          betterleaks git . \
            --no-banner \
            --no-color \
            --redact=100 \
            --report-format=sarif \
            --report-path=security-reports/betterleaks.sarif

      - name: Upload secret scan report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-secrets-${{ github.run_id }}
          path: security-reports/
          if-no-files-found: warn
          retention-days: 14
