# summary: 透過 translation-toolkit 建構翻譯資源包並上傳為 Artifact
# category: 翻譯包
name: 翻譯包｜建構

on:
  workflow_call:
    inputs:
      pack_name:
        required: true
        type: string
        description: "翻譯包名稱，對應 translation-tool 的 --name，例如 ``ModsTranslationPack`` 或 ``ParaTranslationPack``"
      version_group:
        required: false
        type: string
        default: ""
        description: "指定要建構的版本群組（translation-tool 的 --version），留空則建置全部"
      output_path:
        required: false
        type: string
        default: "./output"
        description: "輸出資料夾，預設為 ``./output``"
      runs_on:
        required: false
        type: string
        default: "ubuntu-latest"
        description: "執行環境，預設為 ``ubuntu-latest``"
      artifact_retention_days:
        required: false
        type: number
        default: 3
        description: "Artifact 保留天數，預設為 ``3``"
      use_packsquash:
        required: false
        type: boolean
        default: true
        description: "是否安裝 PackSquash 進行最佳化壓縮，失敗時會自動 fallback 至標準 zip"
    secrets:
      toolkit_token:
        required: true
        description: "用於下載私人 translation-toolkit release 的 PAT（需 ``repo`` 權限）"

permissions:
  contents: read

jobs:
  build-packs:
    name: 建構翻譯資源包
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 下載 translation-tool
        env:
          GH_TOKEN: ${{ secrets.toolkit_token }}
        run: |
          gh release download --repo TeamKugimiya/translation-toolkit \
            --pattern 'translation-tool-linux-amd64' --dir /usr/local/bin
          chmod +x /usr/local/bin/translation-tool-linux-amd64
          mv /usr/local/bin/translation-tool-linux-amd64 /usr/local/bin/translation-tool

      - name: 安裝 PackSquash
        if: ${{ inputs.use_packsquash }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo ComunidadAylas/PackSquash \
            --pattern 'packsquash-x86_64-unknown-linux-gnu.zip' --dir /tmp/packsquash
          unzip -j /tmp/packsquash/packsquash-x86_64-unknown-linux-gnu.zip packsquash -d /usr/local/bin
          chmod +x /usr/local/bin/packsquash

      - name: 建構翻譯資源包
        run: |
          translation-tool build \
            --name "${{ inputs.pack_name }}" \
            --output "${{ inputs.output_path }}" \
            ${{ inputs.version_group != '' && format('--version {0}', inputs.version_group) || '' }}

      - name: 上傳翻譯資源包
        env:
          OUTPUT_PATH: ${{ inputs.output_path }}
          RETENTION_DAYS: ${{ inputs.artifact_retention_days }}
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          cd "$workdir"
          npm init -y >/dev/null
          npm pkg set type=module >/dev/null
          npm install --silent @actions/artifact@^6.2.0
          cat > upload.mjs <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import { DefaultArtifactClient } from '@actions/artifact';
          const dir = path.resolve(process.env.GITHUB_WORKSPACE, process.env.OUTPUT_PATH);
          const retention = Number(process.env.RETENTION_DAYS);
          const zips = fs.readdirSync(dir).filter(f => f.endsWith('.zip'));
          if (zips.length === 0) {
            console.error(`::error::找不到任何 zip 檔案於 ${dir}`);
            process.exit(1);
          }
          const client = new DefaultArtifactClient();
          for (const zip of zips) {
            const full = path.join(dir, zip);
            console.log(`::group::上傳 ${zip}`);
            await client.uploadArtifact(zip, [full], dir, { retentionDays: retention, skipArchive: true });
            console.log('::endgroup::');
          }
          EOF
          node upload.mjs
