# summary: 透過 modpack-tool doctor 驗證模組包專案；建議在 PR 與 main push 呼叫
# category: 模組包
name: 模組包｜驗證

on:
  workflow_call:
    inputs:
      format:
        required: false
        type: string
        default: "text"
        description: "doctor 輸出格式，可用 ``text`` 或 ``json``"
      remote:
        required: false
        type: boolean
        default: false
        description: "是否啟用 ``--remote``，額外驗證上游 artifact 與 ParaTranz 遠端檔案"
      strict:
        required: false
        type: boolean
        default: false
        description: "是否啟用 ``--strict``，將 warning 也視為驗證失敗"
      toolkit_version:
        required: false
        type: string
        default: ""
        description: "要使用的 modpack-tool release tag；留空抓 latest"
      runs_on:
        required: false
        type: string
        default: "blacksmith-2vcpu-ubuntu-2404"
        description: "執行環境，預設為 ``blacksmith-2vcpu-ubuntu-2404``"
    secrets:
      toolkit_token:
        required: true
        description: "用於下載私人 modpack-tool release 的 PAT（需 ``repo`` 權限）"
      curseforge_api_key:
        required: false
        description: "遠端驗證 CurseForge 專案時使用的 API key；會設定為 ``CURSEFORGE_API_KEY``"
      paratranz_token:
        required: false
        description: "啟用 ``remote`` 且專案設定 ParaTranz 時使用；會設定為 ``PARATRANZ_TOKEN``"

permissions:
  contents: read

jobs:
  validate:
    name: 驗證模組包專案
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 安裝 modpack-tool
        uses: TeamKugimiya/reusable-workflows/.github/actions/setup-toolkit@9d730930e48ae736b56a0ee52f94f13056000b9e # v1
        with:
          token: ${{ secrets.toolkit_token }}
          version: ${{ inputs.toolkit_version }}

      - name: 驗證模組包專案
        env:
          DOCTOR_FORMAT: ${{ inputs.format }}
          DOCTOR_REMOTE: ${{ inputs.remote }}
          DOCTOR_STRICT: ${{ inputs.strict }}
          CURSEFORGE_API_KEY: ${{ secrets.curseforge_api_key }}
          PARATRANZ_TOKEN: ${{ secrets.paratranz_token }}
        shell: bash
        run: |
          set -euo pipefail

          args=(doctor --format "$DOCTOR_FORMAT")

          if [ "$DOCTOR_REMOTE" = "true" ]; then
            args+=(--remote)
          fi

          if [ "$DOCTOR_STRICT" = "true" ]; then
            args+=(--strict)
          fi

          modpack-tool "${args[@]}"
