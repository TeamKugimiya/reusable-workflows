name: Setup toolkit binary
description: 下載並安裝 TeamKugimiya toolkit CLI 至 /usr/local/bin

inputs:
  token:
    required: true
    description: 下載私人 toolkit release 的 PAT（需 repo 權限）
  translation:
    required: false
    default: "false"
    description: "true 下載 translation-tool；false 下載 modpack-tool"
  paratranz:
    required: false
    default: "false"
    description: "true 下載 paratranz-tool；不可與 translation 同時啟用"
  version:
    required: false
    default: ""
    description: 要下載的 release tag；留空抓 latest
  verify_checksum:
    required: false
    default: "true"
    description: "預設要求 release 提供 SHA512SUMS 並在安裝前驗證 binary；只有尚未發佈 SHA512SUMS 的 toolkit 才可暫時傳 false"

runs:
  using: composite
  steps:
    - name: 安裝 toolkit
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        IS_PARATRANZ: ${{ inputs.paratranz }}
        IS_TRANSLATION: ${{ inputs.translation }}
        TOOLKIT_VERSION: ${{ inputs.version }}
        VERIFY_CHECKSUM: ${{ inputs.verify_checksum }}
      run: |
        set -euo pipefail

        if [ -z "${GH_TOKEN}" ]; then
          echo "::error::缺少 toolkit token；fork PR 不會傳遞 secrets，請改用同 repo 分支或設定有效 PAT"
          exit 1
        fi

        for value in "${IS_TRANSLATION}" "${IS_PARATRANZ}" "${VERIFY_CHECKSUM}"; do
          if [ "${value}" != "true" ] && [ "${value}" != "false" ]; then
            echo "::error::translation、paratranz 與 verify_checksum 只能是 true 或 false"
            exit 1
          fi
        done

        if [ "${IS_TRANSLATION}" = "true" ] && [ "${IS_PARATRANZ}" = "true" ]; then
          echo "::error::translation 與 paratranz 不可同時啟用"
          exit 1
        fi

        case "$(uname -m)" in
          x86_64) arch="amd64" ;;
          aarch64 | arm64) arch="arm64" ;;
          *)
            echo "::error::不支援的 runner 架構：$(uname -m)"
            exit 1
            ;;
        esac

        if [ "${IS_PARATRANZ}" = "true" ]; then
          repo="TeamKugimiya/paratranz-toolkit"
          asset="paratranz-tool-linux-${arch}"
          bin="paratranz-tool"
        elif [ "${IS_TRANSLATION}" = "true" ]; then
          repo="TeamKugimiya/translation-toolkit"
          asset="translation-tool-linux-${arch}"
          bin="translation-tool"
        else
          repo="TeamKugimiya/modpack-toolkit"
          asset="modpack-tool-linux-${arch}"
          bin="modpack-tool"
        fi

        if [ -n "${TOOLKIT_VERSION}" ]; then
          release_endpoint="repos/${repo}/releases/tags/${TOOLKIT_VERSION}"
          release_label="${TOOLKIT_VERSION}"
        else
          release_endpoint="repos/${repo}/releases/latest"
          release_label="latest"
        fi

        release_log="$(mktemp)"
        if ! asset_api_url="$(gh api "${release_endpoint}" --jq ".assets[] | select(.name == \"${asset}\") | .url" 2>"${release_log}")"; then
          echo "::error::無法查詢 ${repo} 的 ${release_label} release。請確認 toolkit_token 可讀取 ${repo}，且 release 存在。"
          cat "${release_log}" >&2
          rm -f "${release_log}"
          exit 1
        fi
        rm -f "${release_log}"

        if [ -z "${asset_api_url}" ]; then
          echo "::error::${repo} 的 ${release_label} release 找不到 ${asset} asset。"
          echo "可用 assets："
          gh api "${release_endpoint}" --jq '.assets[].name' 2>/dev/null | sed 's/^/- /' >&2 || true
          exit 1
        fi

        download_dir="$(mktemp -d)"
        download_log="${download_dir}/download.log"
        trap 'rm -rf "${download_dir}"' EXIT

        if ! gh api "${asset_api_url}" --header "Accept: application/octet-stream" > "${download_dir}/${asset}" 2>"${download_log}"; then
          echo "::error::無法下載 ${repo} 的 ${asset} asset。請確認 toolkit_token 可下載 ${repo} release assets。"
          cat "${download_log}" >&2
          exit 1
        fi

        if [ "${VERIFY_CHECKSUM}" = "true" ]; then
          checksum_asset="SHA512SUMS"
          checksum_api_url="$(gh api "${release_endpoint}" --jq ".assets[] | select(.name == \"${checksum_asset}\") | .url")"
          if [ -z "${checksum_api_url}" ]; then
            echo "::error::${repo} 的 ${release_label} release 找不到 ${checksum_asset}，拒絕安裝未驗證 binary。"
            exit 1
          fi
          if ! gh api "${checksum_api_url}" --header "Accept: application/octet-stream" > "${download_dir}/${checksum_asset}" 2>"${download_log}"; then
            echo "::error::無法下載 ${repo} 的 ${checksum_asset}。"
            cat "${download_log}" >&2
            exit 1
          fi

          awk -v asset="${asset}" '$2 == asset { print }' "${download_dir}/${checksum_asset}" > "${download_dir}/SELECTED_SHA512SUM"
          if [ "$(wc -l < "${download_dir}/SELECTED_SHA512SUM" | tr -d ' ')" != "1" ]; then
            echo "::error::${checksum_asset} 必須恰好包含一筆 ${asset} checksum。"
            exit 1
          fi
          (
            cd "${download_dir}"
            sha512sum -c SELECTED_SHA512SUM
          )
        fi

        install -m 0755 "${download_dir}/${asset}" "/usr/local/bin/${bin}"

        "${bin}" version
